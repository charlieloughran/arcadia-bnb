<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcadiaBnB - Dashboard & Bookings</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:insert="~{navbar :: navbar}">  </div>


<main>
    <div class="container">

    <div class="dashboard-tabs">
            <button class="btn btn-primary tab-btn active" onclick="switchTab('my-bookings')">My Bookings (Trips)</button>
            <button class="btn btn-outline tab-btn" onclick="switchTab('my-spaces')">My Spaces (Host Reservations)</button>
        </div>

        <section id="my-bookings" class="tab-content">
            <h2>My Bookings</h2>
            <div class="spaces-grid">
                <div th:each="booking : ${myBookings}">
                    <div th:replace="~{booking-card ::booking-card}"></div>
                </div>
            </div>

        </section>

        <section id="my-spaces" class="tab-content" style="display: none;">
            <h2>My Spaces & Incoming Reservations</h2>
            <div class="spaces-grid">

                <div class="spaces-grid">
                    <div th:each="space : ${mySpaces}">
                        <div th:replace="~{space-card :: space-card}"></div>
                    </div>
                </div>

            </div>
        </section>

    </div>
</main>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(section => {
            section.style.display = 'none';
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('btn-primary');
            btn.classList.add('btn-outline');
        });

        document.getElementById(tabId).style.display = 'block';

        const activeBtn = event.currentTarget;
        activeBtn.classList.remove('btn-outline');
        activeBtn.classList.add('btn-primary');
    }
</script>
</body>
</html>
