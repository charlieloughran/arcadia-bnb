<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="en">

<head>
    <meta charset="UTF-8">
    <title>ArcadiaBnB</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>
<body>

<div th:insert="~{navbar :: navbar}">  </div>


<div class="container">

    <h1>Welcome to ArcadiaBnB</h1>

    <div class="space-list">

    <h2 th:text="${nSpaces} + ' spaces are waiting to be discovered'"></h2>


        <div class="card-grid">
            <div th:each="space : ${spaces}">
                <div th:replace="~{space-card :: space-card}"></div>
            </div>
        </div>

    </div>


    <div class="reviews-section">
        <h4>Recent Reviews</h4>
        <ul class="card-grid">
            <li th:each="review : ${reviews}" class="review-item" th:text="${review}">No reviews yet.</li>
        </ul>

        <div class="stats-container">
            <div class="card stat-card">
                <h4>Weekly Activity</h4>
                <p class="info">Bookings secured over the past 7 days:</p>
                <div class="stat-number" th:text="${nBookings}">0</div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
