<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>MakersBNB - Spaces</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>


<body>

<div th:insert="~{navbar :: navbar}">  </div>


<div class="container">
    <div class="search-bar">
        <form th:action="@{/spaces/search}" method="post">
            <label for="availability">Search Date:</label>
            <input type="date" id="availability" name="availability" th:value="${selectedDate}" required />
            <button type="submit">Search</button>
        </form>
        <form th:action="@{/spaces/improved_search}" method="post">
            <label for="availability_start">Start Date:</label>
            <input type="date" id="availability_start" name="availability_start" th:value="${selectedDate}" required />
            <label for="availability_end">End Date:</label>
            <input type="date" id="availability_end" name="availability_end" th:value="${selectedDate}" required />
            <button type="submit">Search</button>
        </form>
    </div>
    <div class="spaces-grid">
        <div th:each="space : ${spaces}">
            <div th:replace="~{space-card :: space-card}"></div>
        </div>
    </div>
</div>
</body>
</html>
