<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>ArcadiaBNB - Spaces</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>


<body>

<div th:insert="~{navbar :: navbar}">  </div>

<div class="container">
    <h1>Spaces</h1>

    <div th:insert="~{searchbar :: searchbar}"> </div>


    <div class="card-grid">
        <div th:each="space : ${spaces}">
            <div th:replace="~{space-card :: space-card}"></div>
        </div>
    </div>
</div>
</body>
</html>
