<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>MakersBNB - Spaces</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>


<body>

<div th:insert="~{navbar :: navbar}">  </div>


<div class="container">
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Price (£)</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="space : ${spaces}">
                <td th:text="${space.name}">Space Name</td>
                <td th:text="${space.description}">Description</td>
                <td th:text="${space.price}">Price</td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
