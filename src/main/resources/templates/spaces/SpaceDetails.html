<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ArcadiaBnB - Space Name</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>
<body>

<div th:insert="~{navbar :: navbar}">  </div>


<div class="container">



<div class="space-card" th:object="${space}">
    <h1 th:text="*{name}">Name</h1>
    <p class="space-price" th:text="${'£' + space.price + ' / night'}"> / night</p>
    <div class="search-section-wrapper">
        <form class="search-form" th:action="@{/spaces/{id}/book(id=*{id})}" method="post">
            <div class="input-group">
                <label for="booked_from">Book From</label>
                <input type="date" id="booked_from" name="booked_from" th:value="${selectedDate}" required />
            </div>
            <div class="input-group">
                <label for="booked_until">Book Until</label>
                <input type="date" id="booked_until" name="booked_until" th:value="${selectedDate}" required />
            </div>
            <button type="submit" class="btn btn-primary">Book</button>
        </form>
    </div>
</div>

    <h2>Description</h2>
    <p class="space-desc" th:text="${space.description}">Description</p>
    <h3>Rules</h3>
    <p th:text="${space.rules}">Rules</p>

</div>
</body>
</html>
